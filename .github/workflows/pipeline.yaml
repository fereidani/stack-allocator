name: pipeline

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  # The `Allocator` trait is stable from Rust 1.100 on. Switch this to
  # `stable` once 1.100 is released.
  RUST_TOOLCHAIN: nightly

jobs:
  cargo_fmt:
    name: "Cargo Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check
  cargo_clippy:
    name: "Cargo Clippy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install $RUST_TOOLCHAIN --profile minimal --component clippy
      - name: Run Clippy
        run: cargo +$RUST_TOOLCHAIN clippy --all-targets --all-features -- -D warnings
      - name: Check documentation
        run: cargo +$RUST_TOOLCHAIN doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
  cargo_test:
    name: "Cargo Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install $RUST_TOOLCHAIN --profile minimal
      - name: Build
        run: cargo +$RUST_TOOLCHAIN build --verbose
      - name: Test with Cargo
        run: cargo +$RUST_TOOLCHAIN test --verbose
      - name: Test with Cargo (alloc)
        run: cargo +$RUST_TOOLCHAIN test --verbose --features alloc
      - name: Test with Cargo (std)
        run: cargo +$RUST_TOOLCHAIN test --verbose --features std
      - name: Test with Cargo (allocator-api2)
        run: cargo +$RUST_TOOLCHAIN test --verbose --features allocator-api2
  cargo_test_release:
    name: "Cargo Test (Release)"
    runs-on: ubuntu-latest
    needs: [cargo_test]
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install $RUST_TOOLCHAIN --profile minimal
      - name: Build
        run: cargo +$RUST_TOOLCHAIN build --release --verbose --features std,allocator-api2
      - name: Test with Cargo (Release)
        run: cargo +$RUST_TOOLCHAIN test --release --verbose --features std,allocator-api2
  cargo_test_no_default_features:
    name: "Cargo Test (No Default Features)"
    runs-on: ubuntu-latest
    needs: [cargo_test_release]
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install $RUST_TOOLCHAIN --profile minimal
      - name: Build
        run: cargo +$RUST_TOOLCHAIN build --no-default-features --verbose
      - name: Test with Cargo (No Default Features)
        run: cargo +$RUST_TOOLCHAIN test --no-default-features --verbose
  no_panic:
    name: "No Panic"
    runs-on: ubuntu-latest
    env:
      # Also proves that no arithmetic overflows.
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
      # One codegen unit, so calls into other units do not hide the proof.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install $RUST_TOOLCHAIN --profile minimal
      # Panics surface as link errors in the optimized test binaries. rustdoc
      # does not optimize doctests, so they are skipped.
      - name: Prove that the allocators cannot panic
        run: cargo +$RUST_TOOLCHAIN test --release --verbose --features no-panic,std,allocator-api2 --lib --tests
  miri:
    name: "Miri"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - name: Set up Miri
        run: cargo +nightly miri setup
      - name: Test with Miri
        run: cargo +nightly miri test --features std,allocator-api2
      # 32-bit targets have a smaller `usize` and a 4-byte aligned buffer.
      - name: Test with Miri (32-bit)
        run: cargo +nightly miri test --target i686-unknown-linux-gnu --features std,allocator-api2
