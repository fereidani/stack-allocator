[package]
name = "stack-allocator"
version = "0.3.0"
edition = "2021"
# The first release with a stable `Allocator` trait.
rust-version = "1.100"
authors = ["Khashayar Fereidani"]
description = "Fast no_std stack and bump allocator for Rust. Put Vec, Box, and HashMap in a fixed-size buffer with zero heap allocations, or fall back to the heap."
license = "MIT"
repository = "https://github.com/fereidani/stack-allocator"
keywords = ["allocator", "stack", "arena", "bump", "no-std"]
categories = [
    "memory-management",
    "no-std",
    "no-std::no-alloc",
    "embedded",
    "data-structures",
]

[dependencies]
# Keep in step with the version that `hashbrown` uses.
allocator-api2 = { version = "0.2.9", default-features = false, optional = true }

# Only CI turns this on, with `RUSTFLAGS="--cfg no_panic"`.
# It is not a feature, so no user build can ever enable it.
[target.'cfg(no_panic)'.dependencies]
no-panic = "0.1.37"

[dev-dependencies]
allocator-api2 = { version = "0.2.9", default-features = false, features = [
    "alloc",
] }
# intentional so when it breaks in CI we notice(allocator-api2 upgrade)
hashbrown = "0"

[features]
# `Default` for `HybridAllocator<N, Global>`.
alloc = []
std = ["alloc", "allocator-api2?/std"]
# Also implement the `allocator-api2` trait, for crates such as `hashbrown`
# that do not use the standard one yet.
allocator-api2 = ["dep:allocator-api2"]

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(no_panic)",
] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
