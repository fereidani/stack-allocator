[package]
name = "stack-allocator"
version = "0.2.0"
edition = "2021"
authors = ["Khashayar Fereidani"]
description = "Fast no_std stack and bump allocator for Rust. Put Vec, Box, and HashMap in a fixed-size buffer with zero heap allocations, or fall back to the heap."
license = "MIT"
repository = "https://github.com/fereidani/stack-allocator"
keywords = ["allocator", "stack", "arena", "bump", "no-std"]
categories = [
    "memory-management",
    "no-std",
    "no-std::no-alloc",
    "embedded",
    "data-structures",
]

[dependencies]
allocator-api2 = { version = "0.2.9", default-features = false }
no-panic = { version = "0.1.37", optional = true }

[dev-dependencies]
allocator-api2 = { version = "0.2.9", default-features = false, features = [
    "alloc",
] }
# intentional so when it breaks in CI we notice(allocator-api2 upgrade)
hashbrown = "0"

[features]
# `Default` for `HybridAllocator<N, Global>`.
alloc = ["allocator-api2/alloc"]
std = ["alloc", "allocator-api2/std"]
# Use the unstable `core::alloc::Allocator`. Enabling `allocator-api2/nightly`
# here would break `hashbrown`.
nightly = []
# Link-time proof that the allocators cannot panic, in release builds only.
no-panic = ["dep:no-panic"]

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
